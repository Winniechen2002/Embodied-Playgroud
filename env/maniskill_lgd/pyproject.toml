[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Original project code; third-party exceptions are defined in repository LICENSING.md.
license = {text = "Apache-2.0"}
name = "agentbench-maniskill-lgd"
version = "0.1.0"
description = "30 standalone ManiSkill tasks: long horizon, geometry and dynamics"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
sim = ["mani-skill-nightly==2026.8.2.400", "sapien==3.0.3", "torch==2.14.0", "trimesh==5.1.0", "Pillow==12.3.0", "gymnasium==1.3.0", "transforms3d==0.4.2"]

[tool.setuptools.packages.find]
include = ["agentbench_maniskill*"]

[tool.setuptools.package-data]
agentbench_maniskill = ["resources/*", "previews/*.jpg", "long_horizon/*.json", "geometry_dynamics/*.json", "evidence/*/*/*.json"]
